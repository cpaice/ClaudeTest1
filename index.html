<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art History Walk</title>
<meta name="description" content="A walk-through museum of the major movements in art history, using public-domain images from Wikimedia Commons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1a1714;
    --ink: #f3ece0;
    --ink-soft: #c9bfae;
    --accent: #c9a45c;
    --frame: #3b2b1a;
    --frame-hi: #8a6a3e;
    --plaque: #f6f0e4;
    --plaque-ink: #2a241c;
    --rail: #0f0d0b;
    --room-h: calc(100dvh - 120px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--rail);
    border-bottom: 1px solid #2c2620;
    position: relative; z-index: 5;
  }
  header h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: .02em;
  }
  header h1 span { color: var(--accent); }
  .nav-btns { display: flex; gap: 8px; align-items: center; }
  .nav-btns button {
    background: transparent; color: var(--ink); border: 1px solid #4a4036;
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .85rem; cursor: pointer;
  }
  .nav-btns button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btns button:disabled { opacity: .35; cursor: default; }
  #roomCount { font-size: .8rem; color: var(--ink-soft); min-width: 54px; text-align: center; }

  /* ---------- Hall (horizontal rooms) ---------- */
  #hall {
    height: var(--room-h);
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #hall::-webkit-scrollbar { display: none; }

  .room {
    flex: 0 0 100vw; height: 100%;
    scroll-snap-align: start;
    position: relative;
    background:
      linear-gradient(to bottom, transparent 82%, rgba(0,0,0,.35) 82%, rgba(0,0,0,.55) 100%),
      radial-gradient(ellipse at 50% 0%, rgba(255,240,210,.18), transparent 60%),
      var(--wall, #5a4a3a);
    display: grid;
    grid-template-columns: minmax(260px, 340px) 1fr;
    gap: 32px;
    padding: 32px 40px 0;
    overflow: hidden;
  }
  /* floor boards */
  .room::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 140px),
                linear-gradient(to bottom, #3a2a1c, #22180f);
    border-top: 6px solid rgba(0,0,0,.35);
    z-index: 0;
  }
  .room > * { position: relative; z-index: 1; }

  .plaque {
    align-self: start;
    background: var(--plaque); color: var(--plaque-ink);
    padding: 22px 22px 18px;
    border-radius: 3px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    max-height: calc(var(--room-h) - 90px);
    overflow-y: auto;
  }
  .plaque .era { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #8a7458; font-weight: 600; }
  .plaque h2 { font-family: "Cormorant Garamond", serif; font-size: 2.1rem; line-height: 1.05; margin: 6px 0 4px; }
  .plaque .dates { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.15rem; color: #6b5a44; margin-bottom: 12px; }
  .plaque p { font-size: .9rem; line-height: 1.55; margin: 0 0 12px; }
  .plaque h3 { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin: 14px 0 6px; color: #8a7458; }
  .plaque ul { margin: 0; padding-left: 18px; font-size: .85rem; line-height: 1.5; }
  .plaque .artists { font-size: .85rem; line-height: 1.5; }

  .wall {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 36px 44px;
    align-content: center;
    padding-bottom: 14%;
    min-width: 0;
  }
  .work { margin: 0; display: flex; flex-direction: column; align-items: center; max-width: 34%; min-width: 160px; }
  .work button {
    all: unset; cursor: zoom-in; display: block;
    padding: 14px;
    background: linear-gradient(135deg, var(--frame-hi), var(--frame) 40%, #2a1e12 60%, var(--frame-hi));
    box-shadow: 0 18px 30px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.4);
    transition: transform .25s ease;
  }
  .work button:hover, .work button:focus-visible { transform: translateY(-4px); }
  .work button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .work .mat { background: #efe9dc; padding: 10px; }
  .work img {
    display: block; max-height: calc(var(--room-h) * .42); max-width: 100%;
    min-width: 120px; min-height: 120px; object-fit: contain; background: #d8d0c0;
  }
  .work .missing {
    width: 200px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; background: #d8d0c0; color: #4a4036; font-size: .78rem; line-height: 1.4;
  }
  .work .missing a { color: #7a4f1a; }
  .work .missing strong { font-family: "Cormorant Garamond", serif; font-size: 1.1rem; display: block; margin-bottom: 6px; }
  .label {
    margin-top: 12px; background: var(--plaque); color: var(--plaque-ink);
    padding: 6px 10px; font-size: .75rem; line-height: 1.35; max-width: 240px; text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); border-radius: 2px;
  }
  .label em { font-family: "Cormorant Garamond", serif; font-size: .98rem; font-style: italic; display: block; }

  /* Entrance & exit rooms */
  .room.special { grid-template-columns: 1fr; place-items: center; text-align: center; }
  .room.special .intro { max-width: 640px; padding-bottom: 12%; }
  .room.special h2 { font-family: "Cormorant Garamond", serif; font-size: clamp(2.4rem, 6vw, 4.2rem); margin: 0 0 8px; line-height: 1; }
  .room.special p { color: var(--ink-soft); line-height: 1.6; }
  .room.special .cta {
    margin-top: 18px; background: var(--accent); color: #1a1714; border: 0; border-radius: 999px;
    padding: 12px 26px; font: 600 1rem Inter, sans-serif; cursor: pointer;
  }
  .room.special .hint { font-size: .8rem; margin-top: 18px; opacity: .8; }
  .room.special a { color: var(--accent); }

  /* ---------- Timeline rail ---------- */
  #rail {
    height: 64px; background: var(--rail); border-top: 1px solid #2c2620;
    position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
  }
  #rail ol { list-style: none; margin: 0; padding: 0 12px; display: flex; height: 100%; align-items: center; gap: 2px; width: max-content; min-width: 100%; }
  #rail li button {
    all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 8px; border-radius: 6px; min-width: 64px;
  }
  #rail li button .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 2px solid #0f0d0b; box-shadow: 0 0 0 1px #4a4036; }
  #rail li button .nm { font-size: .66rem; color: var(--ink-soft); white-space: nowrap; }
  #rail li button .yr { font-size: .6rem; color: #7d7365; }
  #rail li button:hover .nm, #rail li button:focus-visible .nm { color: var(--ink); }
  #rail li button:focus-visible { outline: 2px solid var(--accent); }
  #rail li button[aria-current="true"] { background: #2a241d; }
  #rail li button[aria-current="true"] .dot { box-shadow: 0 0 0 2px var(--accent); transform: scale(1.25); }
  #rail li button[aria-current="true"] .nm { color: var(--accent); font-weight: 600; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh; margin: 0;
  }
  #lightbox::backdrop { background: rgba(8,6,4,.92); }
  #lightbox .lb-inner { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; color: var(--ink); }
  #lightbox img { max-width: 94vw; max-height: 74dvh; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #lightbox .cap { text-align: center; max-width: 720px; }
  #lightbox .cap em { font-family: "Cormorant Garamond", serif; font-size: 1.6rem; display: block; }
  #lightbox .cap small { color: var(--ink-soft); display: block; margin-top: 4px; }
  #lightbox .cap a { color: var(--accent); font-size: .8rem; }
  #lightbox .close {
    position: absolute; top: 14px; right: 16px; background: transparent; border: 1px solid #4a4036; color: var(--ink);
    border-radius: 999px; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer;
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 760px) {
    header { padding: 0 16px; }
    header h1 { font-size: 1.15rem; }
    .nav-btns button { padding: 6px 10px; }
    #roomCount { display: none; }
    .room { grid-template-columns: 1fr; grid-auto-rows: max-content; padding: 16px 16px 0; gap: 18px; overflow-y: auto; align-content: start; }
    .room::after { position: fixed; display: none; }
    .plaque { max-height: none; overflow: visible; }
    .wall { padding-bottom: 24px; gap: 24px; }
    .work { max-width: 100%; }
    .work img { max-height: 46dvh; }
  }
  @media (prefers-reduced-motion: reduce) {
    #hall { scroll-behavior: auto; }
    .work button { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Art History <span>Walk</span></h1>
  <div class="nav-btns">
    <button id="prevBtn" aria-label="Previous room">&larr; Back</button>
    <span id="roomCount" aria-live="polite"></span>
    <button id="nextBtn" aria-label="Next room">Next &rarr;</button>
  </div>
</header>

<main id="hall" aria-label="Museum rooms"></main>

<nav id="rail" aria-label="Timeline of movements"><ol></ol></nav>

<dialog id="lightbox" aria-label="Artwork detail">
  <button class="close" aria-label="Close">&times;</button>
  <div class="lb-inner">
    <img alt="">
    <div class="cap"></div>
  </div>
</dialog>

 */

const imgURL = (file, w) => COMMONS + "Special:FilePath/" + encodeURIComponent(file.replace(/ /g, "_")) + "?width=" + w;
const pageURL = file => COMMONS + "File:" + encodeURIComponent(file.replace(/ /g, "_"));

const MOVEMENTS = [
  {
    id: "prehistoric", name: "Prehistoric Art", era: "Ancient World", dates: "c. 40,000 – 3000 BCE", year: "40,000 BCE",

    traits: ["Mineral pigments: ochre, charcoal, manganese", "Animals far outnumber humans", "Ritual or magical purpose (debated)"],
    artists: "Anonymous: the painters of Lascaux, Chauvet and Altamira",
    works: [
      { title: "Lascaux cave painting", artist: "Unknown", year: "c. 17,000 BCE", file: "Lascaux painting.jpg" },

  },
  {

    artists: "Workshops of royal sculptors, such as Thutmose (bust of Nefertiti)",
    works: [
      { title: "Mask of Tutankhamun", artist: "Unknown", year: "c. 1323 BCE", file: "Tutmask.jpg" },
      { title: "Bust of Nefertiti", artist: "Thutmose", year: "c. 1345 BCE", file: "Nofretete Neues Museum.jpg" }
    ]
  },
  {
    id: "greek", name: "Ancient Greece", era: "Classical Antiquity", dates: "c. 800 – 31 BCE", year: "800 BCE",
    wall: "#4f6170", dot: "#7f9bb3",
    text: "Greek sculptors moved from stiff, frontal kouroi to the relaxed contrapposto stance and idealised anatomy of the Classical period, then to the drama and movement of the Hellenistic age. Their ideals of proportion shaped Western art for millennia.",

    artists: "Myron, Phidias, Praxiteles, Polykleitos",
    works: [
      { title: "Venus de Milo", artist: "Alexandros of Antioch", year: "c. 150–125 BCE", file: "Venus de Milo Louvre Ma399 n4.jpg" },

  },
  {
    id: "roman", name: "Ancient Rome", era: "Classical Antiquity", dates: "c. 500 BCE – 476 CE", year: "500 BCE",
    wall: "#6b3a30", dot: "#b4584a",
    text: "Romans borrowed Greek ideals but added unflinching realism in portraiture, engineering on an enormous scale, and vivid wall painting. Art served the state: emperors used statues, arches and coins as propaganda.",

    artists: "Largely anonymous workshops; architect Apollodorus of Damascus",

      { title: "Augustus of Prima Porta", artist: "Unknown", year: "1st century CE", file: "Statue-Augustus.jpg" },
      { title: "The Colosseum", artist: "Vespasian & Titus", year: "70–80 CE", file: "Colosseum in Rome, Italy - April 2007.jpg" }

    artists: "Mostly anonymous; later Andrei Rublev and Theophanes the Greek",

  {

    wall: "#3d3550", dot: "#8a6fc0",
    text: "Cathedrals became encyclopedias in stone and glass. Gothic builders used pointed arches and flying buttresses to open walls for vast stained-glass windows, while painters like Giotto began to give figures real weight and emotion.",

      { title: "Notre-Dame de Chartres, north rose window", artist: "Unknown", year: "c. 1235", file: "Chartres - cathédrale - rosace nord.jpg" }

  {

    artists: "Parmigianino, Pontormo, Bronzino, El Greco",

  {
    id: "baroque", name: "Baroque", era: "Early Modern", dates: "c. 1600 – 1750", year: "1600",
    wall: "#3a1f1f", dot: "#9c3b34",
    text: "Drama, movement and theatrical light. Fuelled by the Counter-Reformation and powerful monarchies, Baroque art grabs the viewer emotionally, while the Dutch Golden Age turned the same skills to quiet domestic scenes.",

    artists: "Caravaggio, Rembrandt, Vermeer, Velázquez, Rubens, Bernini, Artemisia Gentileschi",

/* ---------- Build the rooms ---------- */
const hall = document.getElementById("hall");
const railList = document.querySelector("#rail ol");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function frameHTML(w, mi, wi) {
  const label = `<div class="label"><em>${esc(w.title)}</em>${esc(w.artist)}, ${esc(w.year)}</div>`;
  if (!w.file) {
    return `<figure class="work"><button disabled style="cursor:default"><div class="mat"><div class="missing">
      <strong>${esc(w.title)}</strong>Still under copyright, so it isn't shown here.<br><a href="${esc(w.link)}" target="_blank" rel="noopener">See it at the museum &rarr;</a>
      </div></div></button>${label}</figure>`;
  }
  return `<figure class="work"><button data-m="${mi}" data-w="${wi}" aria-label="Enlarge ${esc(w.title)}">
      <div class="mat"><img loading="lazy" src="${imgURL(w.file, 640)}" alt="${esc(w.title)} by ${esc(w.artist)}"></div>
    </button>${label}</figure>`;
}

const rooms = [];

// Entrance
rooms.push({ id: "entrance", name: "Entrance", year: "", dot: "#c9a45c" });
hall.insertAdjacentHTML("beforeend", `
  <section class="room special" id="entrance" style="--wall:#2a221a">
    <div class="intro">
      <p style="letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;color:var(--accent)">Welcome</p>
      <h2>A Walk Through Art History</h2>
      <p>${MOVEMENTS.length} rooms, from the caves of Lascaux to the present day. Each room is one movement: read the wall plaque, then click any painting to look closer.</p>
      <button class="cta" data-go="1">Enter the museum &rarr;</button>
      <p class="hint">Use &larr; &rarr; keys, swipe, scroll, or pick an era on the timeline below.</p>
    </div>
  </section>`);

MOVEMENTS.forEach((m, mi) => {
  rooms.push(m);
  hall.insertAdjacentHTML("beforeend", `
    <section class="room" id="${m.id}" style="--wall:${m.wall}" aria-label="${esc(m.name)}">
      <aside class="plaque">
        <div class="era">Room ${mi + 1} &middot; ${esc(m.era)}</div>
        <h2>${esc(m.name)}</h2>
        <div class="dates">${esc(m.dates)}</div>
        <p>${esc(m.text)}</p>
        <h3>Hallmarks</h3>
        <ul>${m.traits.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        <h3>Key artists</h3>
        <div class="artists">${esc(m.artists)}</div>
      </aside>
      <div class="wall">${m.works.map((w, wi) => frameHTML(w, mi, wi)).join("")}</div>
    </section>`);
});

// Exit
rooms.push({ id: "exit", name: "Exit", year: "", dot: "#c9a45c" });
hall.insertAdjacentHTML("beforeend", `
  <section class="room special" id="exit" style="--wall:#2a221a">
    <div class="intro">
      <h2>Thanks for visiting</h2>
      <p>Images are public-domain works hosted on <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>; click any painting, then "View source", for its file page and credits. Twentieth-century works still under copyright link to the museums that hold them.</p>
      <p>Want to go deeper? Try the Met's <a href="https://www.metmuseum.org/toah/" target="_blank" rel="noopener">Heilbrunn Timeline of Art History</a>, <a href="https://smarthistory.org" target="_blank" rel="noopener">Smarthistory</a>, or <a href="https://artsandculture.google.com" target="_blank" rel="noopener">Google Arts &amp; Culture</a>.</p>
      <button class="cta" data-go="0">&larr; Back to the entrance</button>
    </div>
  </section>`);

// Timeline rail
rooms.forEach((r, i) => {
  railList.insertAdjacentHTML("beforeend", `
    <li><button data-go="${i}" style="--c:${r.dot}" aria-label="Go to ${esc(r.name)}">
      <span class="dot"></span><span class="nm">${esc(r.name)}</span><span class="yr">${esc(r.year || "")}</span>
    </button></li>`);
});

/* Missing-image fallback: show a captioned placeholder with a Commons search link */
hall.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  const btn = img.closest("button");
  const { m, w } = btn.dataset;
  const work = MOVEMENTS[m].works[w];
  const q = encodeURIComponent(`${work.title} ${work.artist}`);
  btn.disabled = true; btn.style.cursor = "default";
  img.parentElement.innerHTML = `<div class="missing"><strong>${esc(work.title)}</strong>Image couldn't load.<br>
    <a href="https://commons.wikimedia.org/w/index.php?search=${q}&title=Special:MediaSearch&type=image" target="_blank" rel="noopener">Find it on Wikimedia Commons &rarr;</a></div>`;
}, true);

/* ---------- Navigation ---------- */
const sections = [...hall.querySelectorAll(".room")];
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const roomCount = document.getElementById("roomCount");
let current = 0;

function go(i) {
  i = Math.max(0, Math.min(sections.length - 1, i));
  hall.scrollTo({ left: sections[i].offsetLeft });
}

function setCurrent(i) {
  if (i === current && roomCount.textContent) return;
  current = i;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === sections.length - 1;
  roomCount.textContent = `${i + 1} / ${sections.length}`;
  railList.querySelectorAll("button").forEach((b, bi) => {
    const on = bi === i;
    b.setAttribute("aria-current", on);
    if (on) b.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  });
  history.replaceState(null, "", "#" + sections[i].id);
}

const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) setCurrent(sections.indexOf(en.target)); });
}, { root: hall, threshold: 0.6 });
sections.forEach(s => io.observe(s));

prevBtn.onclick = () => go(current - 1);
nextBtn.onclick = () => go(current + 1);
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (t) go(+t.dataset.go);
});

document.addEventListener("keydown", e => {
  if (lightbox.open) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(current + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(sections.length - 1); }
});

// Vertical mouse wheel walks between rooms (desktop only; mobile rooms scroll vertically)
let wheelLock = 0;
hall.addEventListener("wheel", e => {
  if (matchMedia("(max-width: 760px)").matches) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  if (e.target.closest(".plaque") && e.target.closest(".plaque").scrollHeight > e.target.closest(".plaque").clientHeight) return;
  e.preventDefault();
  const now = Date.now();
  if (now - wheelLock < 600 || Math.abs(e.deltaY) < 8) return;
  wheelLock = now;
  go(current + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

/* ---------- Lightbox ---------- */
const lightbox = document.getElementById("lightbox");
const lbImg = lightbox.querySelector("img");
const lbCap = lightbox.querySelector(".cap");
hall.addEventListener("click", e => {
  const btn = e.target.closest("button[data-m]");
  if (!btn || btn.disabled) return;
  const w = MOVEMENTS[btn.dataset.m].works[btn.dataset.w];
  lbImg.src = imgURL(w.file, 1600);
  lbImg.alt = `${w.title} by ${w.artist}`;
  lbCap.innerHTML = `<em>${esc(w.title)}</em><small>${esc(w.artist)} &middot; ${esc(w.year)}</small>
    <a href="${pageURL(w.file)}" target="_blank" rel="noopener">View source &amp; licence on Wikimedia Commons</a>`;
  lightbox.showModal();
});
lightbox.querySelector(".close").onclick = () => lightbox.close();
lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target.classList.contains("lb-inner")) lightbox.close(); });

/* Deep link to a room via #id */
const start = sections.findIndex(s => "#" + s.id === location.hash);
if (start > 0) requestAnimationFrame(() => { hall.style.scrollBehavior = "auto"; go(start); hall.style.scrollBehavior = ""; });
setCurrent(Math.max(start, 0));
</script>
</body>
</html>
